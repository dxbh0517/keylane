# Nord Frost — the Nord palette as published: Polar Night for the dark scheme,
# Snow Storm for the light one, Frost for everything the interface says and
# Aurora only for state.
#
# It exists because Nord is already on a lot of desktops — GTK, Hyprland,
# terminals, editors — and an assistant that floats above all of them should be
# able to match rather than interrupt. Low contrast, flat surfaces, no glow.
#
# Tokens are documented in README.md → Themes.

[theme]
id = "nord-frost"
name = "Nord Frost"
description = "The Nord palette: Polar Night and Snow Storm, Frost accents, no glow."
author = "Keylane"

[common]
radius-panel = "8px"
radius-hud = "8px"
radius-card = "6px"
radius-control = "4px"
radius-hud-control = "4px"
radius-btn = "4px"
radius-segment = "3px"
radius-list = "6px"
radius-icon-btn = "6px"
radius-pill = "4px"
radius-window = "8px"
font-ui = '"Adwaita Sans", "Cantarell", sans-serif'

# ── badges ──
badge-muted-text = "#71717a"
badge-muted-bg = "rgba(0, 0, 0, 0.05)"
badge-ok-text = "#346538"
badge-ok-bg = "#edf3ec"
badge-active-text = "#1f6c9f"
badge-active-bg = "#e1f3fe"
badge-busy-text = "#956400"
badge-busy-bg = "#fbf3db"
badge-warn-text = "#9f2f2d"

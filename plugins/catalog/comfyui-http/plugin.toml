# Keylane catalog entry. Present in the repository but not installed
# until the user asks for it, so a fresh install ships with nothing
# reaching out to a worker or the network.
id = "comfyui-http"
name = "ComfyUI (HTTP)"
kind = "native"
description = "Legacy direct ComfyUI HTTP client with approved workflow templates. Prefer the MCP plugin unless that will not start."
homepage = "https://github.com/comfyanonymous/ComfyUI"
worker_id = "comfyui"
cloud = false
tags = "worker, local, images, legacy"

# "builtin:<id>" means the implementation ships inside Keylane; the
# catalog entry only decides whether it is registered at all.
entry = "builtin:comfyui-http"

# Paper Terminal — ink on paper rather than glass on a desktop. Flat surfaces,
# hairline rules and hard offset shadows instead of soft glass, a serif for what
# Keylane says and a monospace for what the machine reports.
#
# The dark scheme is the same press with the plate inked: warm near-black paper,
# warm off-white ink. The answer panel floats over other windows, so it carries
# the scheme rather than staying light in the dark.

[theme]
id = "paper-terminal"
name = "Paper Terminal"
description = "Ink on warm paper, hairline rules, serif answers and monospace labels."
author = "Keylane"

[common]
radius-panel = "4px"
radius-hud = "4px"
radius-card = "3px"
radius-control = "3px"
radius-hud-control = "3px"
radius-btn = "3px"
radius-segment = "2px"
radius-list = "3px"
radius-icon-btn = "3px"
radius-pill = "2px"
radius-window = "4px"

font-ui = '"Noto Sans", "Adwaita Sans", sans-serif'
font-display = '"Noto Serif", "Liberation Serif", serif'
font-answer = '"Noto Serif", "Liberation Serif", serif'
font-label = '"Source Code Pro", "Adwaita Mono", monospace'
font-mono = '"Source Code Pro", "Adwaita Mono", monospace'


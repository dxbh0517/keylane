[gateway]
host = "127.0.0.1"
port = 9100
max_retries = 3
local_only = false

[npu]
model_path = "./models/router"
device = "NPU"
fallback_device = "CPU"

[lmstudio]
base_url = "http://127.0.0.1:1234/v1"
default_model = "local-model"
timeout_seconds = 120

[comfyui]
base_url = "http://127.0.0.1:8188"
timeout_seconds = 600
output_dir = "./outputs"

[claude]
command = "claude"
timeout_seconds = 600

[cursor]
command = "cursor-agent"
timeout_seconds = 600

[security]
allowed_project_roots = [
  "~/Documents/Code"
]
require_confirmation_for_modifications = true

[audio]
sample_rate = 16000
channels = 1

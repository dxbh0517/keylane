# Glass Console — the HUD Keylane has always worn: dark glass over the desktop,
# one cyan accent, hairline structure. This is the reference theme: every token
# the stylesheet asks for is listed here, so it is the file to copy from.
#
# Tokens are documented in README.md → Themes. A theme of your own only needs
# the ones it changes, plus `extends = "glass-console"`.

[theme]
id = "glass-console"
name = "Glass Console"
description = "Dark glass over the desktop, one cyan accent, hairline structure."
author = "Keylane"

[common]
# Shape and type. Both schemes share these.
radius-panel = "20px"     # the launcher bar
radius-hud = "18px"       # the answer panel
radius-card = "13px"      # cards and list containers
radius-control = "8px"    # entries, dropdowns, small buttons
radius-hud-control = "9px"  # the answer panel's own small controls
radius-btn = "8px"        # push buttons
radius-segment = "6px"    # a segment inside a segmented control
radius-list = "10px"      # settings list containers
radius-icon-btn = "10px"  # the round-ish icon buttons in the bar
radius-pill = "999px"     # pills and badges
radius-window = "12px"    # the settings window itself

font-ui = '"Adwaita Sans", "Cantarell", sans-serif'
font-display = '"Adwaita Sans", "Cantarell", sans-serif'   # the query line, titles
font-answer = '"Adwaita Sans", "Cantarell", sans-serif'    # the answer prose
font-label = '"Adwaita Sans", "Cantarell", sans-serif'     # small uppercase labels
font-mono = '"Adwaita Mono", "Source Code Pro", monospace'

[light]

# ── launcher bar ──
scrim = "rgba(6, 8, 14, 0.28)"
panel-bg = "rgba(250, 251, 253, 0.93)"
panel-border = "rgba(16, 24, 40, 0.09)"
panel-shadow = "0 0 0 1px rgba(255, 255, 255, 0.7) inset, 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 28px 90px rgba(16, 24, 40, 0.18), 0 8px 24px rgba(16, 24, 40, 0.08)"
search-text = "#101828"
search-caret = "rgb(30, 150, 200)"
search-icon = "#667085"
row-divider = "rgba(16, 24, 40, 0.07)"
status-text = "#98a2b3"
pill-text = "rgb(24, 122, 165)"
pill-bg = "rgba(92, 209, 255, 0.16)"
icon-btn = "#667085"
icon-btn-hover-bg = "rgba(16, 24, 40, 0.06)"
icon-btn-hover-text = "#101828"
footer-btn = "#98a2b3"
mic-active-text = "#ffffff"
mic-active-bg = "rgba(255, 86, 108, 0.24)"
mic-active-hover-bg = "rgba(255, 86, 108, 0.34)"
image-label = "#475467"
history-bg = "rgba(16, 24, 40, 0.02)"
history-text = "#344054"
history-hover-bg = "rgba(16, 24, 40, 0.04)"
history-selected-bg = "rgba(92, 209, 255, 0.18)"

# ── answer HUD ──
hud-bg = "rgba(17, 20, 28, 0.95)"
hud-border = "rgba(255, 255, 255, 0.13)"
hud-shadow = "0 0 0 1px rgba(255, 255, 255, 0.06) inset, 0 1px 0 rgba(255, 255, 255, 0.09) inset, 0 24px 70px rgba(0, 0, 0, 0.62), 0 6px 18px rgba(0, 0, 0, 0.4), 0 0 44px rgba(92, 209, 255, 0.09)"
hud-title = "#f2f4f8"
hud-status = "rgb(129, 200, 228)"
hud-status-settled = "#98a2b3"
hud-close = "#98a2b3"
hud-close-hover-bg = "rgba(255, 255, 255, 0.09)"
hud-scrollbar = "rgba(255, 255, 255, 0.28)"
hud-card-bg = "rgba(255, 255, 255, 0.055)"
hud-card-border = "rgba(255, 255, 255, 0.09)"
hud-headline = "#ffffff"
hud-heading = "rgb(129, 200, 228)"
hud-text = "#dfe4ec"
hud-quote-text = "#b9c1cf"
hud-quote-border = "rgba(92, 209, 255, 0.45)"
hud-marker = "rgb(129, 200, 228)"
hud-kv-bg = "rgba(255, 255, 255, 0.045)"
hud-kv-border = "rgba(255, 255, 255, 0.06)"
hud-kv-key = "rgb(140, 224, 255)"
hud-kv-value = "#e6eaf1"
hud-code-bg = "rgba(0, 0, 0, 0.36)"
hud-code-border = "rgba(255, 255, 255, 0.08)"
hud-code-text = "#cfe9f7"
hud-rule = "rgba(255, 255, 255, 0.1)"
hud-selection-bg = "rgba(92, 209, 255, 0.32)"
hud-selection-text = "#ffffff"
hud-btn-bg = "rgba(255, 255, 255, 0.06)"
hud-btn-border = "rgba(255, 255, 255, 0.09)"
hud-btn-text = "#d5dae4"
hud-btn-hover-bg = "rgba(92, 209, 255, 0.16)"
hud-btn-hover-border = "rgba(92, 209, 255, 0.34)"
hud-btn-hover-text = "#ffffff"
hud-followup-divider = "rgba(255, 255, 255, 0.08)"
hud-followup-text = "#eef1f6"
hud-caret = "rgb(92, 209, 255)"
hud-send-text = "rgb(140, 224, 255)"
hud-send-bg = "rgba(92, 209, 255, 0.14)"
hud-send-hover-bg = "rgba(92, 209, 255, 0.26)"

# ── working orb (drawn in Python, not CSS) ──
orb-accent = "#5cd1ff"
orb-accent-alt = "#a885ff"
orb-idle = "#8c9ebf"

# ── settings window ──
window-bg = "#fcfcfa"
shell-shadow = "0 0 0 1px rgba(255, 255, 255, 0.5) inset, 0 24px 64px rgba(0, 0, 0, 0.14), 0 8px 24px rgba(0, 0, 0, 0.06)"
divider = "rgba(0, 0, 0, 0.06)"
title-text = "#18181b"
close-text = "#71717a"
close-hover-bg = "rgba(0, 0, 0, 0.06)"
nav-bg = "#f4f4f2"
nav-text = "#18181b"
nav-label = "#52525b"
nav-selected-bg = "rgba(0, 0, 0, 0.06)"
nav-selected-text = "#18181b"
section-title = "#27272a"
section-desc = "#71717a"
field-label = "#3f3f46"
field-hint = "#a1a1aa"
status-line-text = "#3f3f46"
status-line-bg = "rgba(0, 0, 0, 0.04)"
footer-text = "#a1a1aa"
pct-text = "#52525b"
download-file = "#52525b"

[plugins.claude]
enabled = true

[plugins.claude.settings]
command = "claude"
timeout_seconds = 600

[plugins.comfyui]
enabled = true

[plugins.comfyui.settings]
command = "comfy-mcp"
args = "[]"
health_tool = "server_info"
run_tool = "generate_image"
env = "{\"COMFY_BIN\": \"/home/emul/.local/bin/comfy\"}"

[plugins.comfyui-http]
enabled = false

[plugins.comfyui-http.settings]
base_url = "http://127.0.0.1:8188"

[plugins.cursor]
enabled = true

[plugins.cursor.settings]
command = "/home/emul/.local/share/cursor-agent/versions/2026.08.11-e8db854/cursor-agent"
timeout_seconds = 600

[plugins.lemonade]
enabled = true

[plugins.lemonade.settings]
base_url = "http://127.0.0.1:13305/api/v1"
default_model = "auto"

[plugins.lmstudio]
enabled = true

[plugins.lmstudio.settings]
base_url = "http://127.0.0.1:1234/v1"
default_model = "local-model"

# Copper Oxide — warm where the others are cool. Oxidised copper and verdigris
# over a brown-black ground, brass hairlines, harder shadows and squarer
# corners than the glass themes.
#
# The light scheme is the same metals on blueprint paper: warm off-white,
# copper ink, the verdigris kept for what the machine says about itself.
#
# Tokens are documented in README.md → Themes.

[theme]
id = "copper-oxide"
name = "Copper Oxide"
description = "Oxidised copper and verdigris over brown-black; brass hairlines, hard shadows."
author = "Keylane"


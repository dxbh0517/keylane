# Aurora — material rather than chrome. Depth comes from translucency, a bright
# top edge and the light the orb throws, not from borders and dividers: most of
# the hairlines in this theme are deliberately transparent. Large radii, large
# type, colour kept to the accent.
#
# The light scheme is the same material lit from the front — frosted white
# rather than smoked glass.

[theme]
id = "aurora"
name = "Aurora"
description = "Translucent material, no borders, large radii, violet and cyan light."
author = "Keylane"

[common]
radius-panel = "28px"
radius-hud = "26px"
radius-card = "20px"
radius-control = "13px"
radius-hud-control = "999px"
radius-btn = "999px"
radius-segment = "999px"
radius-list = "20px"
radius-icon-btn = "999px"
radius-pill = "999px"
radius-window = "26px"

font-ui = '"Adwaita Sans", "Noto Sans", sans-serif'

# Keylane catalog entry. Present in the repository but not installed
# until the user asks for it, so a fresh install ships with nothing
# reaching out to a worker or the network.
id = "lemonade"
name = "Lemonade"
kind = "native"
description = "Lemonade Server, a second OpenAI-compatible local LLM. Use it alongside or instead of LM Studio."
homepage = "https://lemonade-server.ai"
worker_id = "lemonade"
cloud = false
tags = "worker, local, chat"

# "builtin:<id>" means the implementation ships inside Keylane; the
# catalog entry only decides whether it is registered at all.
entry = "builtin:lemonade"

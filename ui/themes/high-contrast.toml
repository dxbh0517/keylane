# High Contrast — for anyone the other themes do not work for.
#
# Every other theme here leans on translucency, hairlines and mid-grey text,
# and all three of those are exactly what fails for low vision, for a glossy
# screen in daylight, and for anyone who has turned on their desktop's own
# high-contrast setting.
#
# So: opaque grounds, pure black on pure white and the reverse, solid 2px
# borders instead of hairlines, no shadows, no translucency anywhere, and one
# high-luminance accent per scheme. Body text is 21:1 and no text token drops
# below WCAG AAA on its own surface — tests/test_themes.py checks it.
#
# Tokens are documented in README.md → Themes.

[theme]
id = "high-contrast"
name = "High Contrast"
description = "Opaque black and white, solid borders, no translucency. WCAG AAA text."
author = "Keylane"


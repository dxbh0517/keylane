# Curated OpenVINO INT4 models for Intel NPU (~7–9B)
default = "qwen2.5-7b-instruct"
device = "NPU"

[[models]]
id = "qwen2.5-7b-instruct"
name = "Qwen 2.5 7B Instruct"
hf_repo = "OpenVINO/Qwen2.5-7B-Instruct-int4-ov"
params_b = 7
description = "General-purpose assistant; good default."

[[models]]
id = "qwen2.5-7b-npu"
name = "Qwen 2.5 7B (NPU-tested)"
hf_repo = "FluidInference/qwen2.5-7b-int4-npu-ov"
params_b = 7
description = "Same family, validated on Intel NPU."

[[models]]
id = "qwen2.5-coder-7b"
name = "Qwen 2.5 Coder 7B"
hf_repo = "OpenVINO/Qwen2.5-Coder-7B-Instruct-int4-ov"
params_b = 7

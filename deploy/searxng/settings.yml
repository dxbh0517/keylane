use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "keylane-local-dev-secret-change-me"
  limiter: false

search:
  safe_search: 0
  default_lang: "en"
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 15.0
  max_request_timeout: 20.0

# Reduce CAPTCHA / rate-limit noise from engines that often fail locally.
engines:
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true

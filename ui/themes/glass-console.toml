control-shadow = "0 1px 2px rgba(0, 0, 0, 0.03)"
trigger-hover-bg = "#f4f4f5"
chevron = "rgba(0, 0, 0, 0.45)"
entry-bg = "#ffffff"
entry-text = "#18181b"
entry-border = "rgba(0, 0, 0, 0.1)"
entry-focus-border = "rgba(0, 0, 0, 0.22)"
entry-focus-ring = "0 0 0 3px rgba(0, 0, 0, 0.06)"
entry-icon = "#52525b"
spin-btn-bg = "rgba(0, 0, 0, 0.05)"
spin-btn-text = "#3f3f46"
textview-bg = "#ffffff"
textview-text = "#27272a"
textview-border = "rgba(0, 0, 0, 0.1)"
selection-bg = "rgba(31, 108, 159, 0.25)"
selection-text = "#18181b"
check-bg = "#ffffff"
check-border = "rgba(0, 0, 0, 0.15)"
check-checked-bg = "#18181b"
check-checked-text = "#ffffff"

# Keylane catalog entry. Present in the repository but not installed
# until the user asks for it, so a fresh install ships with nothing
# reaching out to a worker or the network.
#
# Talks to Mailspring's built-in MCP server over Streamable HTTP
# (Preferences → MCP Server → http://127.0.0.1:2587/mcp).
#
# After install: enable the MCP server in Mailspring, then set auth_header
# to the token from Preferences → MCP Server (raw UUID or "Bearer <token>").
id = "mailspring"
name = "Mailspring"
kind = "mcp"
description = "Search, read and manage mail through Mailspring's local MCP server. Contributes mail tools to the assistant; not a routing destination."
homepage = "https://github.com/Foundry376/Mailspring"
worker_id = ""
cloud = false
tags = "tools, local, mail, mcp"

url = "http://127.0.0.1:2587/mcp"
auth_header = ""
health_tool = ""
run_tool = "search_mail"
